# nixpacks.toml — Railway build configuration
# Railway auto-detects Next.js, but this ensures Prisma generates correctly

[phases.setup]
nixPkgs = ["nodejs_18", "npm-9_x", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npm start"
